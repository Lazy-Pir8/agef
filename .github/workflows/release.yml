name: Release & Linux Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm binutils tar

      - name: Run Tests
        run: |
          go test -v ./...

      - name: Build Binary
        run: |
          mkdir -p bin dist
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/agef ./cmd/agef
          tar -czf dist/agef-linux-amd64.tar.gz -C bin agef

      - name: Build RPM and DEB Packages
        run: |
          chmod +x packaging/build-rpm.sh packaging/build-deb.sh
          ./packaging/build-rpm.sh
          ./packaging/build-deb.sh

      - name: Create Release and Upload Packages
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.rpm
            dist/*.deb
            dist/*.tar.gz
            bin/agef
          generate_release_notes: true
